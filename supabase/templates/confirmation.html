<!doctype html>
<html lang="en"><body style="background:#FECC07;margin:0;padding:24px;font-family:Arial,sans-serif">
<main style="background:#FFFFFF;border:1px solid #FA5501;border-radius:24px;padding:24px;max-width:560px;margin:auto;color:#FA5501">
<h1>Verify your Wakey-Wakey! email</h1>
<p>Enter this confirmation code in the app:</p>
